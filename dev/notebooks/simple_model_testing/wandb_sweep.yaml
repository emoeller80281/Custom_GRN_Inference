program: wandb_sweep.py
method: bayes
metric:
  name: val/auroc
  goal: maximize
parameters:
  sample_name:
    values: ["hepatocytes_1", "hepatocytes_3", "buffer_1", "buffer_2", "E7.5_rep1", "E8.5_rep1", "sample_1"]
  max_peaks_per_tg:
    values: [16, 32, 50, 100]
  max_cells_per_pair:
    values: [16, 32, 64]
  pct_true_edges:
    values: [0.25, 0.5, 0.75]
  true_false_ratio:
    values: [1.0, 2.0, 3.0]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
