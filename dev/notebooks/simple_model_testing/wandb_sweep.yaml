program: wandb_sweep.py
name: tf_tg_sweep_refined
method: bayes
metric:
  name: val/auroc.max
  goal: maximize
parameters:
  sample_name:
    values: ["hepatocytes_1", "hepatocytes_3", "buffer_1", "buffer_2", "E7.5_rep1", "E8.5_rep1", "sample_1"]
  d_model:
    values: [64, 128, 192, 256, 512, 1024]
  max_peaks_per_tg:
    min: 2
    max: 100
  max_cells_per_pair:
    min: 2
    max: 1000
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
